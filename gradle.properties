# -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT: sin esto, resolver una
# dependencia nueva puede fallar con PKIX/SSL handshake en este equipo
# (el JDK no confia en algo que Windows si: antivirus/proxy con
# inspeccion TLS). Mismo apanio que en HogarSeguro.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
android.useAndroidX=true
kotlin.code.style=official
